name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PyYAML
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Run planner tests
        run: bash test/plan.sh
      # Pinned so a new release cannot change the lint rules under an unchanged workflow.
      - name: Install actionlint
        run: |
          version=v1.7.12
          curl -fsSL -o /tmp/actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/${version}/actionlint_${version#v}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
      - name: Lint workflows
        run: /tmp/actionlint -shellcheck= .github/workflows/orchestrator.yml .github/workflows/owner.yml .github/workflows/test.yml
  ureview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ureview
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ureview/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check formatting
        run: npm run format:check
