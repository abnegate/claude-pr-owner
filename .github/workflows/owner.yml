name: ureview owner

on:
  workflow_call:
    inputs:
      learner:
        description: >-
          GitHub login that owns schedule and workflow_dispatch runs, which have
          no pull request author. Callers pass vars.CLAUDE_LEARNER. Empty skips
          those events.
        type: string
        default: ''
    outputs:
      login:
        description: GitHub login whose ureview enrolment applies to this event.
        value: ${{ jobs.resolve.outputs.login }}
      enrolled:
        description: "'true' when a UREVIEW_<LOGIN> variable exists for the owner."
        value: ${{ jobs.resolve.outputs.enrolled }}
      oauth_secret:
        description: Name of the owner's Claude OAuth token secret.
        value: ${{ jobs.resolve.outputs.oauth_secret }}
      api_key_secret:
        description: Name of the owner's Anthropic API key secret.
        value: ${{ jobs.resolve.outputs.api_key_secret }}
      push_secret:
        description: Name of the owner's push token secret.
        value: ${{ jobs.resolve.outputs.push_secret }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      login: ${{ steps.owner.outputs.login }}
      enrolled: ${{ steps.owner.outputs.enrolled }}
      oauth_secret: ${{ steps.owner.outputs.oauth_secret }}
      api_key_secret: ${{ steps.owner.outputs.api_key_secret }}
      push_secret: ${{ steps.owner.outputs.push_secret }}
    steps:
      - name: Resolve owner
        id: owner
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          LEARNER: ${{ inputs.learner }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_HEAD_REPO_FULL: ${{ github.event.workflow_run.head_repository.full_name }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -uo pipefail

          repository="${REPO:-}"
          event="${EVENT_NAME:-}"
          variables="${VARS_JSON:-{\}}"

          login=''
          enrolled=false
          oauth_secret=''
          api_key_secret=''
          push_secret=''

          write_outputs() {
            {
              echo "login=$login"
              echo "enrolled=$enrolled"
              echo "oauth_secret=$oauth_secret"
              echo "api_key_secret=$api_key_secret"
              echo "push_secret=$push_secret"
            } >> "$GITHUB_OUTPUT"
          }

          owner=''
          case "$event" in
            pull_request|pull_request_review|pull_request_review_comment)
              owner="${PR_AUTHOR:-}"
              ;;
            issue_comment|issues)
              owner="${ISSUE_USER:-}"
              ;;
            schedule|workflow_dispatch)
              owner="${LEARNER:-}"
              ;;
            workflow_run)
              if [[ "${WR_CONCLUSION:-}" == "failure" \
                && "${WR_EVENT:-}" == "pull_request" \
                && "${WR_HEAD_REPO_FULL:-}" == "$repository" ]]; then
                if ! authors=$(gh pr list --repo "$repository" --head "${WR_HEAD_BRANCH:-}" --state open --json author,headRefOid,isCrossRepository \
                  | jq -r --arg sha "${WR_HEAD_SHA:-}" '[.[] | select(.headRefOid == $sha and .isCrossRepository == false) | .author.login] | unique | join(" ")'); then
                  echo "::warning::gh pr list failed, so the pull request for this workflow_run is unknown."
                  authors=''
                fi
                if [[ "$authors" == *" "* ]]; then
                  echo "::warning::Open pull requests at ${WR_HEAD_SHA:-} have different authors ($authors), so the ureview owner is ambiguous."
                else
                  owner="$authors"
                fi
              fi
              ;;
          esac

          if [[ -z "$owner" || ! "$owner" =~ ^[A-Za-z0-9-]{1,39}$ ]]; then
            echo "Could not resolve a ureview owner for this event; skipping."
            write_outputs
            exit 0
          fi

          login="$owner"
          key=$(printf '%s' "$owner" | tr '[:lower:]-' '[:upper:]_')

          if jq -e --arg name "UREVIEW_$key" 'any(keys[]; ascii_upcase == $name)' <<<"$variables" >/dev/null; then
            enrolled=true
            oauth_secret="UREVIEW_OAUTH_TOKEN_$key"
            api_key_secret="UREVIEW_API_KEY_$key"
            push_secret="UREVIEW_PUSH_TOKEN_$key"
            echo "@$login is enrolled in ureview."
          else
            echo "@$login is not enrolled in ureview (no UREVIEW_$key variable); skipping."
          fi

          write_outputs
          exit 0
